
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Music Player</title>
  </head>
  <body style="background-color: #000000; overflow-x: hidden; overflow-y: hidden;">
    <form id="form">

    <div class="search" style="position: absolute;">  
      <i  class="search-icon fas fa-search"></i>  
      <input class="search-input" type="text" placeholder="Search song">
      <button class="search-btn">Search</button>
    </div>

    </form>
  <div class="back">

  </div>
  <div class="back-shodow">

    <div class="music-container" id="music-container">
      <div class="music-info">
        <h4 id="title"></h4>

        <div class="progress-container" id="progress-container">
          <div class="progress" id="progress"></div>
        </div>
          <div style="font-size: 13px;color: #355fdf;">
          <span id="currTime">--:--</span>
          <span style="margin-left: 60%;" id="durTime">--:--</span>
        </div>
      </div>

      <audio src="music/Without Me.mp3" id="audio"></audio>

      <div class="img-container">
        <img src="images/Without Me.jpg" alt="music-cover" id="cover" />
      </div>
      <div class="navigation">
        <button id="prev" class="action-btn">
          <i class="fas fa-backward"></i>
        </button>
        <button id="play" class="action-btn action-btn-big">
          <i class="fas fa-play"></i>
        </button>
        <button id="next" class="action-btn">
          <i class="fas fa-forward"></i>
        </button>
      </div>
    </div>
  </div>
    <script src="script.js"></script>
  </body>
</html>
