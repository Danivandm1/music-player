
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Music Player</title>
  </head>
  <body>
    <div class="div1">
    <input type="text"class="Inputsearch" id="search">
    <button type="button" class="btnSearch">kgg;cuqg</button>
    </div>
    <h1>Music Player</h1>

    <div class="music-container" id="music-container">
      <div class="music-info">
        <h4 id="title"></h4>

        <div class="progress-container" id="progress-container">
          <div class="progress" id="progress"></div>
        </div>
          <div style="font-size: 14px;color: #b64863">
          <span id="currTime">--:--</span>
          <span style="margin-left: 60%;" id="durTime">--:--</span>
        </div>
      </div>

      <audio src="music/Without Me.mp3" id="audio"></audio>

      <div class="img-container">
        <img src="images/Without Me.jpg" alt="music-cover" id="cover" />
      </div>
      <div class="navigation">
        <button id="prev" class="action-btn">
          <i class="fas fa-backward"></i>
        </button>
        <button id="play" class="action-btn action-btn-big">
          <i class="fas fa-play"></i>
        </button>
        <button id="next" class="action-btn">
          <i class="fas fa-forward"></i>
        </button>
      </div>
    </div>
    <div class="search">
      <button type="button" id="btnExit" class="btn-small btn-ghost"><i class="fas fa-times"></i></button>

    </div>

    <script src="script.js"></script>
  </body>
</html>
